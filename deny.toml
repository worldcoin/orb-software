[graph]
# Cargo deny will check dependencies via `--all-features`
all-features = true

[advisories]
ignore = [
	# List of advisories we have ignored
	{ id = "RUSTSEC-2026-0002", reason = "todo" },
	# rustls-webpki 0.101.7 is pulled in by aws-sdk-s3 (via aws-smithy-http-client
	# → rustls 0.21.12); upgrade requires aws-sdk-s3 to switch to its hyper-1.x
	# connector, which conflicts with the ring crypto backend used by several
	# other transitive deps; upgrade blocked until aws-sdk-s3 resolves the conflict.
	{ id = "RUSTSEC-2026-0049", reason = "transitive dep via aws-sdk-s3 legacy rustls stack, low severity, upgrade blocked by upstream crypto backend conflict" },
	{ id = "RUSTSEC-2026-0098", reason = "transitive dep via aws-sdk-s3 legacy rustls stack, low severity, upgrade blocked by upstream crypto backend conflict" },
	{ id = "RUSTSEC-2026-0099", reason = "transitive dep via aws-sdk-s3 legacy rustls stack, low severity, upgrade blocked by upstream crypto backend conflict" },
	{ id = "RUSTSEC-2026-0104", reason = "transitive dep via aws-sdk-s3 legacy rustls stack, low severity, upgrade blocked by upstream crypto backend conflict" },
	{ id = "RUSTSEC-2026-0118", reason = "no upgrade available, is merely DoS" },
	{ id = "RUSTSEC-2026-0119", reason = "no upgrade available, is merely DoS" },
	# lru 0.12 and 0.13 are pulled in by aws-sdk-s3 and iroh. The fix is only
	# available in lru 0.18.2, outside their semver constraints. Exploitation also
	# requires a cache key with a panicking Drop implementation and catching that panic.
	{ id = "RUSTSEC-2026-0253", reason = "transitive dep via aws-sdk-s3 and iroh; no compatible upgrade available and exploit requires a panicking key destructor" },
	# h2 0.3.27 (unbounded empty DATA frames, low severity) is pulled in by
	# aws-sdk-s3's default "rustls" feature, which uses aws-smithy-runtime's
	# legacy hyper 0.14 connector. That connector's h2 0.3.x line was never
	# patched (the fix only shipped in h2 0.4.16); the only way to drop it is
	# aws-sdk-s3's "default-https-client" feature (hyper 1.x, patched h2).
	# We tried that: it hardcodes the aws-lc-rs rustls crypto backend, which
	# conflicts with "ring" and causes a hard "ambiguous CryptoProvider" panic
	# at runtime, since ring is *also* hardcoded (with no aws-lc-rs option) by
	# several unrelated transitive deps we don't control: quinn/iroh-quinn
	# (via iroh), wtransport, tokio-websockets, hyper-rustls, tokio-rustls,
	# and rcgen. Reconciling all of those is out of proportion to this
	# advisory's severity, so we accept it instead.
	{ id = "RUSTSEC-2026-0258", reason = "aws-sdk-s3's legacy hyper 0.14 connector pulls unpatched h2 0.3.x; the fix (switching to the hyper-1.x connector) hardcodes a crypto backend that conflicts with several unrelated deps (quinn/iroh, wtransport, tokio-websockets, hyper-rustls, rcgen) that hardcode a different one, causing a runtime panic; low severity (DoS only), reconciling the backends is out of proportion" },
]
unmaintained = "workspace" # only warn for direct dependencies (not transitive ones)
version = 2

[bans]
skip = [{ name = "serialport", version = "4.7.0" }]

[sources]
unknown-registry = "deny"

[licenses]
version = 2
# We want really high confidence when inferring licenses from text
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
	"0BSD",
	"Apache-2.0 WITH LLVM-exception",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-2-Clause-Patent",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"LicenseRef-ftdi-proprietary",
	"LicenseRef-ring",
	"LicenseRef-wc-proprietary",
	"MIT",
	"MPL-2.0", # Although this is copyleft, it is scoped to modifying the original files
	"OpenSSL",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Unlicense",
	"Zlib",
	"NCSA",
]
exceptions = [
	# We do not particularly like the EPL-2.0 license (MPL-2.0 is much better).
	# But we are willing to make an exception for zenoh's transitive
	# dependencies *only*.
	# See also: https://github.com/eclipse-zenoh/zenoh/issues/1625
	{ allow = ["EPL-2.0"], crate = "keyed-set" },
	{ allow = ["EPL-2.0"], crate = "ringbuffer-spsc" },
	{ allow = ["EPL-2.0"], crate = "token-cell" },
	{ allow = ["EPL-2.0"], crate = "validated_struct" },
	{ allow = ["EPL-2.0"], crate = "validated_struct_macros" },

	# We don't atm have a viable altnerative to libsquashfs1 that is
	# permissively licensed. This is OK as long as we link it dynamically.
	{ allow = ["LGPL-3.0-or-later"], crate = "license-stub-libsquashfs1" },

	# Gstreamer is needed, unless we want to write our own GPU accelerated video codec
	# or use nvidia video-codec-sdk ourselves. This is OK as long as we link gstreamer
	# dynamically
	{ allow = ["LGPL-2.1-only"], crate = "license-stub-gstreamer" },

	# GStreamer depends on glib, so does orb-bidiff-squashfs-shim. This is OK as
	# long as we link it dynamically.
	{ allow = ["LGPL-2.1-or-later"], crate = "license-stub-glib" },
]


# See https://github.com/briansmith/ring/blob/95948b3977013aed16db92ae32e6b8384496a740/deny.toml#L12
[[licenses.clarify]]
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name = "ring"

[[licenses.clarify]]
# @thebutlah reviewed the license code. It doesn't impose any copyleft
# restrictions on us, and doesn't seem to impose any restrictions on
# distribution. As long as we don't put any other copyleft code in
# orb-software, we won't run afoul of any license restrictions AFAICT. We
# should seek to reimplement pyftdi in rust using nusb if we can, though.
# Because its not good to have these proprietary libs in here.
expression = "LicenseRef-ftdi-proprietary"
license-files = [{ path = "LICENSE", hash = 0x0d4f9606 }]
name = "libftd2xx-ffi"

# Google's minijail is BSD-3-Clause but the Cargo.toml doesn't specify a
# license field. The LICENSE file is at the root of the repository, so the path
# is relative to the crate directories (rust/minijail/ and rust/minijail-sys/).
[[licenses.clarify]]
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0xf1f873f5 }]
name = "minijail"

[[licenses.clarify]]
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0xf1f873f5 }]
name = "minijail-sys"
