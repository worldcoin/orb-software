[package]
name = "orb-ipcp-hpke"
version = "0.1.0"
description = "Shared iPCP HPKE encryption and decryption"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.4"
hpke = { version = "=0.14.1", default-features = false, features = ["x25519", "aes"] }
rand_core = "0.10.1"
sha2 = "0.10.8"
thiserror = "2.0.17"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1"
