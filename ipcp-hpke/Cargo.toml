[package]
name = "orb-ipcp-hpke"
version = "0.1.0"
description = "Shared HPKE encryption and decryption"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
hpke = { version = "=0.14.1", default-features = false, features = [
	"x25519",
	"aes",
	"getrandom",
	"alloc",
] }
sha2-hpke = { package = "sha2", version = "0.11", default-features = false, features = [
	"zeroize",
] }
thiserror = "2.0.17"
zeroize = "1.8.2"

[dependencies.orb-relay-messages]
features = ["client"]
git = "https://github.com/worldcoin/orb-relay-messages.git"
rev = "ed1d3b0d6e3b62d3c81a2b52db6c23a331a4eb44"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1"
