[package]
name = "orb-ipcp-hpke"
version = "0.1.0"
description = "Shared iPCP image HPKE encryption and decryption"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
hpke = { version = "=0.14.1", default-features = false, features = ["x25519", "aes"] }
rand_core = "0.10.1"
sha2-hpke = { package = "sha2", version = "0.11", default-features = false, features = [
	"zeroize",
] }
thiserror = "2.0.17"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1"
