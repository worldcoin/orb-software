[package]
name = "orb-oes"
version = "0.0.1"
description = "Android daemon that forwards the Orb Event Stream (OES) to the Orb backend"
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bon.workspace = true
chrono = { workspace = true, features = ["serde"] }
color-eyre.workspace = true
derive_more = { workspace = true, default-features = false, features = ["from"] }
flume.workspace = true
eyre.workspace = true
oes.workspace = true
orb-build-info.workspace = true
orb-endpoints.workspace = true
orb-info = { workspace = true, features = [
	"orb-id",
	"orb-jabil-id",
	"orb-name",
	"orb-os-release",
] }
orb-dogd.workspace = true
orb-oes-binder.workspace = true
orb-security-utils = { workspace = true, features = ["reqwest", "blocking"] }
orb-telemetry = { workspace = true, features = ["otel"] }
rand.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
rsbinder.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
signal-hook.workspace = true
tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
orb-security-utils = { workspace = true, features = [
	"reqwest",
	"blocking",
	"dangerously-allow-http",
] }
eyre.workspace = true
serial_test.workspace = true
tempfile = "3.10.1"

[build-dependencies]
orb-build-info = { workspace = true, features = ["build-script"] }
