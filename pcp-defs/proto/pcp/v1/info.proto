syntax = "proto3";

package pcp.v1;

message Info {
  string signup_id = 1 [json_name = "signup_id"];
  string signup_id_salt = 2 [json_name = "signup_id_salt"];
  string signup_reason = 3 [json_name = "signup_reason"];
  string signup_reason_salt = 4 [json_name = "signup_reason_salt"];
  string orb_id = 5 [json_name = "orb_id"];
  string orb_id_salt = 6 [json_name = "orb_id_salt"];
  string operator_id = 7 [json_name = "operator_id"];
  string operator_id_salt = 8 [json_name = "operator_id_salt"];
  // Unix seconds, as a decimal string.
  string timestamp = 9;
  string timestamp_salt = 10 [json_name = "timestamp_salt"];
  string qr_code = 11 [json_name = "qr_code"];
  string qr_code_salt = 12 [json_name = "qr_code_salt"];
  // Base64.
  string orb_public_key_certificate = 13 [json_name = "orb_public_key_certificate"];
  string left_ir_image_id = 14 [json_name = "left_ir_image_id"];
  repeated string left_ir_multiframe_image_ids = 15 [json_name = "left_ir_multiframe_image_ids"];
  repeated string left_iris_code_aggregate_image_ids = 16 [json_name = "left_iris_code_aggregate_image_ids"];
  string right_ir_image_id = 17 [json_name = "right_ir_image_id"];
  repeated string right_ir_multiframe_image_ids = 18 [json_name = "right_ir_multiframe_image_ids"];
  repeated string right_iris_code_aggregate_image_ids = 19 [json_name = "right_iris_code_aggregate_image_ids"];
  string thumbnail_image_id = 20 [json_name = "thumbnail_image_id"];
  string software_version = 21 [json_name = "software_version"];
  string software_version_salt = 22 [json_name = "software_version_salt"];
  string orb_country = 23 [json_name = "orb_country"];
  string orb_country_salt = 24 [json_name = "orb_country_salt"];
  string id_commitment = 25 [json_name = "id_commitment"];
  string id_commitment_salt = 26 [json_name = "id_commitment_salt"];
  // Set only on device-bound packages (version 2.8).
  optional string device_public_key = 27 [json_name = "device_public_key"];
  optional string device_public_key_salt = 28 [json_name = "device_public_key_salt"];
}
