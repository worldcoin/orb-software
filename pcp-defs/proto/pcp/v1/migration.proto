syntax = "proto3";

package pcp.v1;

message Migration {
  optional string tee_version = 1 [json_name = "tee_version"];
  optional string src_signup_id = 2 [json_name = "src_signup_id"];
  optional string source_pcp_version = 3 [json_name = "source_pcp_version"];
  optional uint64 migrated_ts = 5 [json_name = "migrated_ts"];
  optional string biometric_pipeline_version = 7 [json_name = "biometric_pipeline_version"];
}
