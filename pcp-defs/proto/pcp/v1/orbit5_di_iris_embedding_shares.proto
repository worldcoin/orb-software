syntax = "proto3";

package pcp.v1;

// One recipient's bundle; filename indices 0-4 map to Shamir IDs 1-5.
message Orbit5DiIrisEmbeddingShares {
  Orbit5DiIrisEmbeddingShareV1 share_v1 = 1;
}

message Orbit5DiIrisEmbeddingShareV1 {
  string model_version = 1;
  string shares_version = 2;
  string embedding_version = 3;

  // Each vector contains 512 unsigned 16-bit share values.
  repeated uint32 left_share = 4;
  repeated uint32 left_mirror_share = 5;
  repeated uint32 right_share = 6;
  repeated uint32 right_mirror_share = 7;
}
