syntax = "proto3";

package pcp.v1;

message BackendKeys {
  BackendKey iris = 1;
  BackendKey normalized_iris = 2 [json_name = "normalized_iris"];
  BackendKey face = 3;
  BackendKey tier2 = 4;
}

message BackendKey {
  // Base64.
  string public_key = 1 [json_name = "public_key"];
  string encrypted_private_key = 2 [json_name = "encrypted_private_key"];
}
