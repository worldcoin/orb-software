[package]
name = "deps-tests"
version = "0.0.0"
description = "Smoke test for libraries that are tricky to compile or non-portable"
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Use the same sodium binding as production crates. Cargo cannot resolve
# sodiumoxide and alkali together: both native bindings declare links = "sodium".
# The workspace enables pkg-config to use the platform's prebuilt libsodium.
sodiumoxide.workspace = true
libc = "0.2"
nix.workspace = true
openssl = "0.10"
ring = "0.17"
rodio = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.8"
seek-camera.path = "../seek-camera/wrapper"
